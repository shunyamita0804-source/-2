<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>モンスターマスター</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff6e4;--fg:#2a2340;--card:#fffdf7;--line:#2a2340;--acc:#5b3df5;--mut:#7a7290;--hp:#2fbf71}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1626;--fg:#f3eeff;--card:#251f38;--line:#f3eeff;--acc:#9b86ff;--mut:#a89fc4;--hp:#4fd68c}}
:root[data-theme="dark"]{--bg:#1a1626;--fg:#f3eeff;--card:#251f38;--line:#f3eeff;--acc:#9b86ff;--mut:#a89fc4;--hp:#4fd68c}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:460px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 12px}
h2{font-size:1.05rem}h3{font-size:1rem;margin:18px 0 8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
.row{display:flex;gap:12px;align-items:center}
.mon{width:96px;height:96px;flex:none}
.info{flex:1;min-width:0}
small{color:var(--mut)}
.bar{height:10px;border:2px solid var(--line);border-radius:6px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.t{display:block;width:100%;margin-top:8px;text-align:left}
button.go{display:block;width:100%;margin-top:8px;background:var(--acc);color:#fff;font-weight:700}
button.ghost{margin-top:20px;box-shadow:none;border-style:dashed;font-size:.85rem}
.pick{display:flex;flex-direction:column;align-items:center;padding:8px 4px}
.pick .mon{width:72px;height:72px}
#msg{min-height:3em;margin:10px 0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.vs .mon{margin:0 auto}
.wheelbox{position:relative;width:200px;margin:8px auto 0}
.ptr{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:1.4rem;line-height:1;z-index:1}
.wheel{width:200px;height:200px;border-radius:50%;border:4px solid var(--line)}
.leg{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:.75rem;margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.wheel{transition-duration:.01s!important}}
.bar i{transition:width .5s}
.mw{position:relative;width:110px;margin:0 auto}
.mw .mon{width:110px;height:110px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) scale(1.03)}}
.lunge0{animation:l0 .45s}@keyframes l0{40%{transform:translateX(42px) rotate(6deg)}}
.lunge1{animation:l1 .45s}@keyframes l1{40%{transform:translateX(-42px) rotate(-6deg)}}
.hit .mon{animation:hit .5s}@keyframes hit{20%{transform:translateX(-9px);filter:brightness(2.4)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}}
.dead .mon{animation:none;transform:rotate(80deg) translateY(30px);opacity:.3;transition:all .8s}
.fx{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;left:50%;top:5%;font-weight:900;font-size:1.7rem;color:#ffec5c;text-shadow:2px 2px 0 #b0182c,-2px -2px 0 #b0182c,2px -2px 0 #b0182c,-2px 2px 0 #b0182c;animation:pop 1s forwards}
.pop.heal{color:#c9ffd8;text-shadow:2px 2px 0 #12803e,-2px -2px 0 #12803e,2px -2px 0 #12803e,-2px 2px 0 #12803e}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.4)}20%{opacity:1;transform:translate(-50%,0) scale(1.3)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
.sk{position:absolute;left:50%;top:45%;font-size:3.4rem;line-height:1;animation:sk .8s forwards}
@keyframes sk{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-30deg)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}
#ov{position:fixed;inset:0;pointer-events:none;opacity:0}
#ov.on{animation:ov .55s}@keyframes ov{25%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.mw .mon{animation:none}}
details{margin-top:10px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
summary{cursor:pointer;font-weight:700}
button.t small{display:block}
button.t.on{background:var(--acc);color:#fff}button.t.on small{color:#fff}
.sb{padding:6px 8px;font-size:.8rem;box-shadow:none;margin:3px}
.sb i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;border:1px solid var(--line)}
#inf{min-height:2.6em;margin:6px 0 0;font-size:.85rem}
.row .mw{width:96px;margin:0;flex:none}.row .mw .mon{width:96px;height:96px}
.train .mon{animation:tr .9s}@keyframes tr{20%{transform:translateY(-16px) scale(1.1,.9)}40%{transform:translateY(0) scale(.9,1.1)}60%{transform:translateY(-9px)}80%{transform:none}}
.pt{position:absolute;bottom:25%;font-size:1.5rem;line-height:1;opacity:0;animation:pt 1.1s ease-out forwards}
@keyframes pt{0%{opacity:0;transform:translate(0,20px) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-80px) scale(1.3)}}
.tabs button.on{background:var(--acc);color:#fff}.tabs{margin:12px 0 0}
.st{display:grid;grid-template-columns:1fr 1fr;font-size:.85rem}
.rr{margin-top:8px}.rr .mon{width:56px;height:56px}.rr .info{font-size:.85rem}
.scene{border:2px solid var(--line);border-radius:18px;overflow:hidden;padding-bottom:0;background:linear-gradient(#ffc98a 0,#ffe2b8 34%,#d9b98a 34%,#c39a68 100%)}
.lan{position:relative;text-align:center;padding-top:8px;letter-spacing:.35em;font-size:1.3rem;line-height:1.4}
.lan::before{content:"";position:absolute;left:-6%;right:-6%;top:10px;height:26px;border-bottom:3px solid #5b4632;border-radius:50%}
.mtitle{text-align:center;font-weight:900;font-size:1.25rem;color:#5a2d0c;text-shadow:1px 1px 0 #fff3dc;margin:8px 0 12px}
.stall{margin:0 16px 12px}
.awn{height:30px;border-radius:8px 8px 18px 18px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.s0 .awn{background:repeating-linear-gradient(90deg,#e0413a 0 24px,#fff4dc 24px 48px)}
.s1 .awn{background:repeating-linear-gradient(90deg,#2f9e5b 0 24px,#fff4dc 24px 48px)}
.s2 .awn{background:repeating-linear-gradient(90deg,#3a7fd6 0 24px,#fff4dc 24px 48px)}
button.sign{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:6px;padding:8px;background:#8b5a2b;color:#fff3dc;border:3px solid #4a2f14;border-radius:0 0 10px 10px;box-shadow:0 3px 0 #4a2f14}
.sign small{color:#ffe2b0}.sign .em{font-size:1.5rem;line-height:1.2}
.ground{height:16px;margin-top:6px;background:repeating-linear-gradient(90deg,#a9834f 0 18px,#b98f58 18px 36px)}
.mk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}.mk .mon{width:80px;height:80px}.mk button{margin-top:4px}
textarea{width:100%;box-sizing:border-box;margin:8px 0;font:inherit;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:10px}
.mon{position:relative}.mon img{width:100%;height:100%;object-fit:contain;display:block}
.mon img.b2{position:absolute;right:-8px;bottom:-4px;width:38%;height:38%}
.fz{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.slot{flex:1;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:12px;padding:6px;text-align:center}.slot .mon{width:64px;height:64px}
.mr{margin-top:10px}.mr .mon{width:76px;height:76px}
.sr{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.sr i{flex:none;width:12px;height:12px;border-radius:50%;margin-top:6px;border:1px solid var(--line)}.sr small{display:block}
.tg{font-size:.7rem;border:1px solid var(--line);border-radius:6px;padding:0 4px}
button.sign{flex-direction:row;justify-content:flex-start;text-align:left;gap:12px;padding:10px 12px}
.sign .tx{display:flex;flex-direction:column}.sign .tx b{font-size:1.05rem}.sign .ic svg{width:56px;height:56px;display:block}
.rbar{margin:22px 4px 14px}
.rb{position:relative;display:flex;height:50px;border:3px solid var(--line);border-radius:12px}
.rs{display:flex;align-items:center;justify-content:center;font-size:1.25rem;overflow:hidden;border-right:2px solid var(--line)}
.rs:first-child{border-radius:8px 0 0 8px}.rs:last-child{border-right:0;border-radius:0 8px 8px 0}
.rs.hit{filter:brightness(1.5) saturate(1.3);outline:3px solid #fff;outline-offset:-3px}
#cur{position:absolute;top:-10px;bottom:-10px;left:0;width:6px;background:#fff;border:2px solid #1b1530;border-radius:3px;box-shadow:0 0 8px #fff;pointer-events:none}
:root{--cp:#ffe2c2;--ci:#d8f1cf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cp:#5a4128;--ci:#2a4a30}}
:root[data-theme="dark"]{--cp:#5a4128;--ci:#2a4a30}
.cp{background:var(--cp)}.ci{background:var(--ci)}
button.t.eq{outline:3px solid var(--acc);outline-offset:1px}
.si{display:inline-block;vertical-align:middle;flex:none}.si svg{width:26px;height:26px;display:block}
.sr{padding:6px 8px;border:0;border-radius:10px;margin-top:6px;align-items:center}
.rs .si svg{width:30px;height:30px}
.map{position:relative;aspect-ratio:320/420;border:2px solid var(--line);border-radius:18px;overflow:hidden;background:#8fd3ff}
.mbg{position:absolute;inset:0;width:100%;height:100%}
.mapt{position:absolute;top:8px;left:0;right:0;text-align:center;font-weight:900;font-size:1.15rem;color:#3a2a1a;text-shadow:1px 1px 0 #fff}
button.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;background:none;border:0;box-shadow:none;padding:0;cursor:pointer}
button.hs:active{transform:translate(-50%,-48%)}
button.hs::before{content:"";position:absolute;top:-6px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.5);animation:ring 1.8s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.15);opacity:.4}}
.hs .ic{position:relative}.hs .ic svg{width:72px;height:72px;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.hs b{position:relative;background:#fff8e6;color:#3a2a1a;border:2px solid #3a2a1a;border-radius:10px;padding:1px 8px;font-size:.85rem;margin-top:2px;white-space:nowrap}
button.hs:disabled{opacity:.55}
.pasture{position:relative;height:200px;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(#bfe6ff 0 34%,#8fd17a 34% 100%);margin:8px 0}
.dc{position:absolute;font-size:1.8rem;line-height:1}.pe{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:#3a2a1a}
.wk{position:absolute;width:58px;height:58px;animation:wk var(--d,10s) linear infinite alternate}
.wk .mon{width:58px;height:58px;animation:hop .55s ease-in-out infinite}
@keyframes wk{from{left:3%}to{left:calc(97% - 58px)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.tscene{position:relative;height:200px;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(#ffe0b0 0 58%,#c9a06a 58% 100%);display:flex;align-items:flex-end;justify-content:center;margin:8px 0}
.tdeco{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-around;align-items:center;font-size:2.2rem}.tdeco svg{width:54px;height:54px}
.tscene .mw.big{width:130px;margin:0 0 12px}.mw.big .mon{width:130px;height:130px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px}.tile span{font-size:1.8rem;line-height:1}
@media (prefers-reduced-motion:reduce){.wk,.wk .mon,button.hs::before{animation:none}}
.hud{font-weight:700;margin:6px 0}
.npc{display:flex;gap:8px;align-items:flex-end;margin:8px 0}.av svg{width:64px;height:64px;display:block}
.bub{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.9rem}
.cal{border:2px solid var(--line);border-radius:12px;padding:8px;margin:8px 0;background:var(--card)}
.wks,.mos{display:flex;gap:4px;margin-top:6px}.cal span{flex:1;text-align:center;border:1px solid var(--line);border-radius:6px;padding:2px 0;font-size:.78rem}
.cal span.cur{background:var(--acc);color:#fff;font-weight:700}
.tm{text-align:center;font-size:1.5rem;font-weight:900;margin:4px 0}
.rs.off{filter:grayscale(1) brightness(.75);opacity:.55}
.map{box-shadow:0 0 0 4px #e8c86a,0 6px 0 4px #8a5a2b}
.mapt{top:7.5%;font-size:1.25rem;letter-spacing:.08em}
.cl{animation:drift 22s ease-in-out infinite alternate}.cl.c2{animation-duration:30s}
@keyframes drift{to{transform:translateX(50px)}}
@media (prefers-reduced-motion:reduce){.cl{animation:none}}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:20;width:40px;height:40px;padding:0;border-radius:50%;font-size:1.1rem;box-shadow:none;opacity:.9}
</style></head><body><main>

<div id="app"></div>
</main>
<div id="ov"></div>

 if(fail){up=0;m.fa=Math.min(100,m.fa+10);m.st=Math.min(100,m.st+10)}else{up=Math.max(1,Math.round(up*(1-m.st/200)));m[k]+=up;m.fa=Math.min(100,m.fa+12);m.st=Math.min(100,m.st+(m.last==k?8:3))}
 m.last=k;adv();save();await fx(fail?"💦":TE[k],fail?"#888888":TC[k],fail?"しっぱい…":`${LAB[k]} +${up}`);after(fail?"疲れがたまっていて、失敗してしまった…":`${LAB[k]}が ${up} 上がった！`)}
async function rest(){const m=S.m;m.fa=Math.max(0,m.fa-40);m.st=Math.max(0,m.st-25);m.last=null;adv();save();await fx("💤🌙","#7c8cff","きゅうけい");after("ゆっくり休んで、疲れがとれた。")}
function reset(b){if(b.dataset.s!="1"){b.dataset.s="1";b.textContent="もう一度押すと最初から";return}S={v:4,y:1000,mo:4,wk:1,g:1000,box:[],m:null};save();render()}
function drawBar(A){const ws=A.eq.map(k=>SK[k][2]),t=ws.reduce((a,b)=>a+b,0);$("#rb").innerHTML=A.eq.map((k,j)=>`<div class="rs ${SK[k][7]=="p"?"cp":"ci"}" style="width:${ws[j]/t*100}%">${ic(k)}</div>`).join("")+'<div id="cur"></div>';return ws.map(w=>w/t)}
async function sweep(A,auto){
 const fr=drawBar(A),cur=$("#cur"),go=$("#go");
 let stop=false,pos=0,t0=null;const off=Math.random()*2,dur=800+R(1400);
 if(!auto)go.onclick=()=>{stop=true};
 await new Promise(res=>{const f=n=>{if(t0==null)t0=n;const ph=((n-t0)/1000*1.5+off)%2;pos=ph<1?ph:2-ph;cur.style.left=`calc(${pos*100}% - 3px)`;if(stop||(auto&&n-t0>dur))return res();requestAnimationFrame(f)};requestAnimationFrame(f)});
 let a=0,j=0;for(;j<fr.length-1;j++){a+=fr[j];if(pos<a)break}
 $("#rb").children[j].classList.add("hit");await sleep(700);return A.eq[j];
}
const ss=x=>`威力${Math.round(x[1]*100)}　命中${x[8]}　クリティカル率${Math.round(x[9]*100)}%　ガッツ${GC[SK.indexOf(x)]}`;
const leg=A=>{const ws=A.eq.map(k=>SK[k][2]),t=ws.reduce((a,b)=>a+b,0);$("#leg").innerHTML=`<h3>${A.name}のわざ</h3>`+A.eq.map((k,j)=>{const x=SK[k];return `<div class="sr ${x[7]=="p"?"cp":"ci"}">${ic(k)}<div><b>${x[0]}</b> <span class="tg">${CL[x[7]]}</span><small>${x[6]}<br>${ss(x)}　ルーレット幅 ${Math.round(ws[j]/t*100)}%</small></div></div>`}).join("")};
async function fight(i,teach){bgm("battle");
 const dj=teach!=null,m0=S.m,rkk=dj?0:i,t=dj?Math.min(9,2+Math.floor(m0.sk.length/2)):0;
 const v=dj?Math.round(60+t*11):60+rkk*18,lb=dj?"修行":`ランク${RN[rkk]}大会`;
 const p={...m0,gr:GR[SP[m0.sp][5]]},e={name:dj?LAB[teach]+"の師匠":`ランク${RN[rkk]}の対戦相手`,sp:0,h:dj?R(360):rkk*60,s2:!dj&&rkk>=4?0:null,li:Math.round(v*1.3),po:v,in:v,hi:v,ev:v,de:v,gr:5,eq:dj?[DJ[teach][0],0,1,3]:rkk>=4?[4,5,7,2]:rkk>=2?[0,2,3,6]:[0,1,2,3]};
 const pl=[p,e],mx=[p.li*4,e.li*4],H=[...mx],G=[50,50];
 $("#app").innerHTML=`<div class="tm" id="tm">のこり 60秒</div><div class="vs">${[0,1].map(s=>`<div><div class="mw" id="m${s}"><div class="mon">${svg(pl[s].sp,pl[s].h,pl[s].s2)}</div><div class="fx" id="f${s}"></div></div><b>${pl[s].name}</b><div id="b${s}"></div><div id="g${s}"></div></div>`).join("")}</div><div class="rbar"><div id="rb" class="rb"></div></div><p id="msg"></p><button id="go" class="go">ストップ！</button><div id="leg"></div>`;
 const say=t=>$("#msg").textContent=t,go=$("#go");let T=60;
 const upd=()=>{$("#tm").textContent=`のこり ${Math.max(0,Math.ceil(T))}秒`;[0,1].forEach(s=>{$("#b"+s).innerHTML=bar(H[s],mx[s],"var(--hp)")+`<small>ライフ ${Math.max(0,Math.round(H[s]))} / ${mx[s]}</small>`;$("#g"+s).innerHTML=bar(G[s],100,"#ffc233")+`<small>ガッツ ${Math.floor(G[s])}</small>`})};
 upd();leg(p);const fr=drawBar(p),cur=$("#cur"),segs=[...$("#rb").children].slice(0,p.eq.length);
 say(`${lb}　${e.name}があらわれた！`);await sleep(900);say("タイミングよくストップ！ガッツが足りない技は出せません。");
 let ph=Math.random()*2,pos=0,lock=0,en=1.5,fin=false;
 const act=(s,k)=>{const A=pl[s],Dd=pl[1-s],sk=SK[k];
  if(G[s]<GC[k]){say(`${A.name}：ガッツが足りない！`);pop(s,"💦","sk");return}
  G[s]-=GC[k];let tx=`${A.name}の「${sk[0]}」！`;cls(s,"lunge"+s);
  if(Math.random()>Math.min(.99,Math.max(.15,sk[8]/100+(A.hi-Dd.ev)*.004))){tx+=" かわされた！";pop(1-s,"MISS","pop");sfx(0)}
  else if(sk[5]=="d"){Dd.de=Math.max(0,Dd.de-Math.round(A.in*.15));tx+=` ${Dd.name}のぼうぎょが下がった！`;pop(1-s,sk[4],"sk");pop(1-s,"DEF↓","pop")}
  else{const cr=Math.random()<sk[9],d=Math.max(1,Math.round(((sk[7]=="p"?A.po:A.in)*sk[1]*(.8+Math.random()*.4)*(cr?1.6:1)-Dd.de*.3)*4));H[1-s]-=d;tx+=` ${cr?"急所に命中！":""}${d}ダメージ`;pop(1-s,sk[4],"sk");cls(1-s,"hit");pop(1-s,(cr?"CRIT ":"")+"-"+d,"pop");sfx(cr?2:1);if(sk[1]>=.9)flash(sk[3])}
  say(tx)};
 go.onclick=()=>{if(lock>0||fin)return;let a=0,j=0;for(;j<fr.length-1;j++){a+=fr[j];if(pos<a)break}segs[j].classList.add("hit");setTimeout(()=>segs[j].classList.remove("hit"),300);lock=.5;act(0,p.eq[j])};
 await new Promise(res=>{const iv=setInterval(()=>{const dt=.05;T-=dt;G[0]=Math.min(100,G[0]+p.gr*dt);G[1]=Math.min(100,G[1]+e.gr*dt);lock-=dt;ph+=dt*1.2;const q=ph%2;pos=q<1?q:2-q;cur.style.left=`calc(${pos*100}% - 3px)`;p.eq.forEach((k,j)=>segs[j].classList.toggle("off",GC[k]>G[0]));
  en-=dt;if(en<=0){const ok=e.eq.filter(k=>GC[k]<=G[1]);if(ok.length){let x=Math.random()*ok.reduce((a,k)=>a+SK[k][2],0),k=ok[0];for(const c of ok){x-=SK[c][2];if(x<0){k=c;break}}act(1,k)}en=1+Math.random()*1.4}
  upd();if(H[0]<=0||H[1]<=0||T<=0){clearInterval(iv);res()}},50)});
 fin=true;go.disabled=true;const ko=H[0]<=0||H[1]<=0;say(ko?"KO！":"タイムアップ！");await sleep(900);
 [0,1].forEach(s=>{if(H[s]<=0)$("#m"+s).classList.add("dead")});
 const win=H[1]<=0||(H[0]>0&&H[0]>H[1]),m=S.m;let res=win?`勝利！${ko?"":"（判定勝ち）"}`:"敗北…";
 if(win){pop(0,"🎉","sk");sfx(3);
  if(dj){const left=DJ[teach].filter(x=>!m.sk.includes(x));if(left.length){const k=left[R(left.length)];m.sk.push(k);if(m.eq.length<4)m.eq.push(k);res+=` 「${SK[k][0]}」［${CL[SK[k][7]]}技］を覚えた！`+(m.eq.includes(k)?"":"（トップ画面のわざ設定でセット）")}}
  else{S.g+=PZ[rkk];res+=` 賞金 ${PZ[rkk]}G を獲得！`;if(rkk==m.rk&&m.rk<5){m.rk++;res+=` ランク${RN[m.rk]}にランクアップ！`}}
 }else m.st=Math.min(100,m.st+10);
 m.fa=Math.min(100,m.fa+8);adv();save();say(res);go.disabled=false;go.textContent="もどる";go.onclick=()=>after(res);
}
$("#snd").textContent=AU.on?"🔊":"🔇";
render();
</script></body></html>
